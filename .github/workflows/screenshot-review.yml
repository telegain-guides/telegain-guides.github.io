name: Ежемесячная проверка актуальности скриншотов

on:
  schedule:
    # Первого числа каждого месяца: интерфейс меняется чаще, чем тексты.
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Создать задачу на сверку скриншотов
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(find public/screenshots -name '*.webp' | wc -l)
          MONTH=$(date +'%Y-%m')
          gh issue create \
            --title "Сверка скриншотов с интерфейсом — $MONTH" \
            --label documentation \
            --body "$(cat <<BODY
          Ежемесячная сверка: интерфейс панели мог измениться с прошлой проверки.

          **Скриншотов в репозитории:** $COUNT

          ## Что проверить

          - [ ] Экраны совпадают с текущим интерфейсом панели
          - [ ] На кадрах нет реальных телефонов, сессий, реквизитов прокси и юзернеймов клиентов
          - [ ] Подписи и alt-тексты соответствуют тому, что видно на изображении
          - [ ] Даты последней проверки в затронутых руководствах обновлены

          ## Как переснять

          Скриншоты снимаются воспроизводимо, на демонстрационных фикстурах.
          Порядок описан в \`docs/maintenance-policy.md\` центрального хаба.

          Если интерфейс не менялся — закройте задачу с комментарием и обновите даты.
          BODY
          )"
